<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fog Mirror</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <canvas id="screen"></canvas>

    <!-- have to click before the browser since they block cam and mic until user clicks something -->
    <div id="start-screen">
        <h1>fog mirror</h1>
        <p>Blow on your mic to steam up the screen, then write with your mouse, trackpad or finger.</p>
        <button id="start-button">start camera + mic</button>
        <p id="error-message"></p>
    </div>

    <div id="hint" class="hidden">blow on the mic (or hold space) to fog · draw to wipe · H hides controls</div>

    <!-- controls -->
    <div id="controls" class="hidden">
        <div id="mic-meter" title="mic level (the pink line is the blow threshold)">
            <div id="mic-level"></div>
            <div id="mic-threshold"></div>
        </div>
        <label>mic <input type="range" id="sensitivity-slider" min="0" max="1" step="0.01" value="0.5"></label>
        <label>brush <input type="range" id="brush-slider" min="10" max="80" value="34"></label>
        <label>linger <input type="range" id="linger-slider" min="0" max="1" step="0.01" value="0.5"></label>
        <button id="fog-button">fog</button>
        <button id="clear-button">clear</button>
        <button id="save-button">save</button>
    </div>

    <script src="script.js"></script>

</body>

</html>
